rule view_colocpleio:
    input:
        os.path.join(resultdir, "postgres/coloc"),
        os.path.join(resultdir, "postgres/tophits"),
        os.path.join(resultdir, "postgres/cytoband"),
        os.path.join(resultdir, "postgres/geneid2symbol"),
        # os.path.join(resultdir, "postgres/gwas_annot"),
        os.path.join(resultdir, "postgres/pos19"),
        os.path.join(resultdir, "postgres/etissue_category"),
        os.path.join(resultdir, "postgres/entrezgene2ensg2symbol"),
        os.path.join(resultdir, "postgres/entrezgene2pubmed_count"),
        os.path.join(resultdir, "postgres/ncbirefseq"),
        os.path.join(resultdir, "postgres/open_gwas"),
        os.path.join(resultdir, "postgres/opengwas2category_ontology"),
        os.path.join(resultdir, "postgres/opengwas2trait_ontology"),
        os.path.join(resultdir, "postgres/1000genomes_af"),
        os.path.join(resultdir, "query_ontology.py/gwas_trait_ontology.ods"),
        os.path.join(resultdir, "postgres/watanabe_posthuma2019"),
        os.path.join(resultdir, "postgres/view_ensg2pubmed_count"),
    output:
        os.path.join(resultdir, "postgres/view_colocpleio"),
    params:
        db_url,
        public_data_dir,
        "colocpleio",
        'SELECT DISTINCT co.chrom, pos19.pos19, co.pos38, co.cytoband, co.rsid, co.ref, co.alt, gwtron.gwas_trait, gwtron.gwas_ontology_term AS gwas_trait_ontology_term, gwtron.gwas_ontology_id AS gwas_trait_ontology_id, gwcaon.gwas_ontology_term AS gwas_category_ontology_term, gwcaon.gwas_ontology_id AS gwas_category_ontology_id, op.batch, op.pmid, op.ncontrol, op.ncase, co.gwas_beta, refseq.symbol AS eqtl_gene_symbol, co.eqtl_beta, co.eqtl_id, co.eqtl_gene_id, co.gwas_id, co.gwas_pval, co.eqtl_pval, co.pp_h4_abf, co.snp_pp_h4, co.coloc_variant_id AS tophits_variant_id, co.nsnps, eqtl_annot.etissue_category_term, en2.pubmed_count, af.eas_af, af.amr_af, af.afr_af, af.eur_af, af.sas_af, refseq.refseq_transcript_id AS eqtl_refseq_transcript_id, refseq.refseq_transcript_start38 AS eqtl_refseq_transcript_start38, refseq.refseq_transcript_end38 AS eqtl_refseq_transcript_end38, refseq.refseq_transcript_strand AS eqtl_refseq_transcript_strand, wp.domains AS domains_watanabe2019 FROM (((((((((( SELECT DISTINCT co0.chrom, co0.pos AS pos38, concat(co0.chrom, cy.cytoband) AS cytoband, co0.rsid, co0.ref, co0.alt, co0.gwas_beta, co0.eqtl_beta, co0.eqtl_id, co0.eqtl_gene_id, co0.gwas_id, co0.gwas_pval, co0.eqtl_pval, co0.pp_h4_abf, co0.snp_pp_h4, co0.coloc_variant_id, co0.nsnps FROM coloc co0, cytoband cy WHERE ((co0.chrom = cy.chrom) AND (co0.pos <@ cy.start_end38))) co LEFT JOIN "genome-mysql.soe.ucsc.edu/hg38/ncbirefseq" refseq ON (((refseq.gene_id)::text = (co.eqtl_gene_id)::text))) LEFT JOIN opengwas2trait_ontology gwtron ON (((gwtron.gwas_id)::text = (co.gwas_id)::text))) LEFT JOIN opengwas2category_ontology gwcaon ON (((gwcaon.gwas_id)::text = (co.gwas_id)::text))) LEFT JOIN open_gwas_info op ON (((op.gwas_id)::text = (co.gwas_id)::text))) LEFT JOIN pos19 ON ((co.pos38 = pos19.pos))) LEFT JOIN eqtl_annot ON (((co.eqtl_id)::text = (eqtl_annot.eqtl_id)::text))) LEFT JOIN ensg2pubmed_count en2 ON (((co.eqtl_gene_id)::text = (en2.gene_id)::text))) LEFT JOIN "ftp-trace.ncbi.nih.gov/1000genomes/ftp/release/20130502" af ON ((((co.rsid)::text = (af.rsid)::text) AND ((co.ref)::text = (af.ref)::text) AND ((co.alt)::text = (af.alt)::text)))) LEFT JOIN watanabe_posthuma2019 wp ON ((((co.rsid)::text = (wp.rsid)::text) AND ((co.ref)::text = (wp.ref)::text) AND ((co.alt)::text = (wp.alt)::text)))) ORDER BY co.chrom, pos19.pos19, co.pos38, co.alt, gwtron.gwas_trait, refseq.symbol, co.eqtl_id;',
    shell:
        """
        PGPASSWORD="postgres"  psql -U postgres -d postgres -h 0.0.0.0 -p 5435 -c "DROP MATERIALIZED VIEW IF EXISTS {params[2]};"
        PGPASSWORD='postgres'  psql -U postgres -d postgres -h 0.0.0.0 -p 5435 -c 'CREATE MATERIALIZED VIEW {params[2]} AS {params[3]};' && touch {output[0]}
        """

