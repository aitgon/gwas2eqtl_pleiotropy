import os  # Make sure to import os module
import multiprocessing

vep_sif = config['vep_sif']
db_url = config['db_url']
result_dir = config['result_dir']
pleio_high_cutoff = config['pleio_high_cutoff']
process_data_dir = config['process_data_dir']
public_data_dir = config['public_data_dir']
snp_pp_h4 = config['snp_pp_h4']

rule all_03snkfl_analysis_vep:
    input:
        os.path.join(result_dir, "pltbar_vep_consequence.py/missense_variant.png"),

rule plt_vep_consequence:
    input:
        os.path.join(result_dir, "cmpt_vep_consequence_fisher.py/cons_stat.tsv"),
    output:
        os.path.join(result_dir, "pltbar_vep_consequence.py/missense_variant.png"),
#    params:
#        script_path=os.path.join(result_dir, "pltbar_vep_consequence.py"),  # Fixed missing quote
    shell:
        "python src/pltbar_vep_consequence.py {input[0]} $(dirname {output[0]})"

rule cmpt_vep_consequence_fisher:
    input:
        os.path.join(result_dir, "cmpt_vep_input.py/vep_input.tsv"),
        os.path.join(result_dir, "cmpt_vep_input.py/vep_output.tsv"),
    output:
        os.path.join(result_dir, "cmpt_vep_consequence_fisher.py/cons_stat.tsv"),
    params:
        pleio_high_cutoff=pleio_high_cutoff
    threads: multiprocessing.cpu_count()  # ~nb of vep consequences
    shell:
        "python src/cmpt_vep_consequence_fisher.py {threads} {params[0]} {input[0]} {input[1]} {output[0]}"

rule run_vep:
    input:
        os.path.join(result_dir, "cmpt_vep_input.py/vep_input.tsv"),
    output:
        os.path.join(result_dir, "cmpt_vep_input.py/vep_output.tsv"),
    params:
    singularity: vep_sif,
    shell:
        "vep --offline --dir_cache /opt/vep/vep-cache --cache_version 108 --plugin TSSDistance --force_overwrite -i {input[0]} --output_file {output[0]}"

rule cmpt_vep_input:
    input:
        os.path.join(result_dir, "cmpt_count_per_rsid.py/count_per_rsid_gwas_egene_etissue.ods"),
        os.path.join("/home/gonzalez/Software/vep-cache/homo_sapiens/108_GRCh38/info.txt"),
    output:
        os.path.join(result_dir, "cmpt_vep_input.py/vep_input.tsv"),
    params:
        snp_pp_h4=snp_pp_h4,
        db_url=db_url,
    shell:
        "python src/cmpt_vep_input.py {params.snp_pp_h4} {params.db_url} {input[0]} {input[1]} {output[0]}"

