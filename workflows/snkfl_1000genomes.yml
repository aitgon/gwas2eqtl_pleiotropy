data_dir = config['data_dir']
chr_lst = list(range(1, 23))

rule all:
    """usage: snakemake -p --cores all -s [SNAKEFILE] --config [data_dir=DIR]

Download 1000 genome allele frequencies and extract them to TSV files.

--config KEYS:
  data_dir=DIR  Output data directory
"""
    input:
         expand(os.path.join(data_dir, "ftp-trace.ncbi.nih.gov/1000genomes/ftp/release/20130502/ALL.chr{CHR}.phase3_shapeit2_mvncall_integrated_v5a.20130502.genotypes.af.tsv.gz"), CHR=chr_lst),

rule vcf_to_tsv_eur:
    input:
        os.path.join(data_dir, "ftp-trace.ncbi.nih.gov/1000genomes/ftp/release/20130502/ALL.chr{CHR}.phase3_shapeit2_mvncall_integrated_v5a.20130502.genotypes.vcf.gz"),
    output:
        os.path.join(data_dir, "ftp-trace.ncbi.nih.gov/1000genomes/ftp/release/20130502/ALL.chr{CHR}.phase3_shapeit2_mvncall_integrated_v5a.20130502.genotypes.af.tsv.gz"),
    shell:
        """bcftools query -f '%CHROM\t%POS\t%ID\t%REF\t%ALT\t%INFO/EAS_AF\t%INFO/AMR_AF\t%INFO/AFR_AF\t%INFO/EUR_AF\t%INFO/SAS_AF\n' {input[0]} |gzip >{output[0]}"""

rule dwnld_g1k:
    output:
        os.path.join(data_dir, "ftp-trace.ncbi.nih.gov/1000genomes/ftp/release/20130502/ALL.chr{CHR}.phase3_shapeit2_mvncall_integrated_v5a.20130502.genotypes.vcf.gz"),
    params:
        "ftp-trace.ncbi.nih.gov/1000genomes/ftp/release/20130502/ALL.chr{CHR}.phase3_shapeit2_mvncall_integrated_v5a.20130502.genotypes.vcf.gz",
        data_dir,
    shell:
        """wget -c -q -r {params[0]} -P {params[1]}"""
