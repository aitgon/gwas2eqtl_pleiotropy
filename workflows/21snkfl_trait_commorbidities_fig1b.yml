"""
snakemake -j all -s tools/21snkfl_trait_commorbidities_fig1b.yml --config db_url=postgresql://chiliconcarne101usr:chiliconcarne101pwd@0.0.0.0:5435/gwas2eqtl gwas_category_ods=config/gwas418.ods result_dir=out/7_7
"""

db_url = config['db_url']
gwas_trait_ods = config['gwas_trait_ods']
gwas_category_ods = config['gwas_category_ods']
result_dir = config['result_dir']
snp_pp_h4 = config['snp_pp_h4']

rule all_gwas_categoryes:
    input:
        # fig 1a
        os.path.join(result_dir, "cmpt_proportion_tophits_eqtl.py/loci_explained_proportion.png"),
        # fig 1b
        os.path.join(result_dir, "plthtmp_disease_comorbidity_matrix.py/corr.svg"),

rule plthtmp_disease_comorbidity_matrix:
    input:
        os.path.join(result_dir, "cmpt_comorbidites.py/corr.tsv"),
        os.path.join(result_dir, "annot_gwas_metadata.py/gwas_metadata.ods"),
    output:
        # fig 1b
        os.path.join(result_dir, "plthtmp_disease_comorbidity_matrix.py/corr.svg"),
    params:
        db_url,
    shell:
        "python src/plthtmp_disease_comorbidity_matrix.py {params[0]} {input[0]} {input[1]} {output[0]}"

rule cmpt_disease_comorbidity_matrix:
    output:
        os.path.join(result_dir, "cmpt_comorbidites.py/corr.tsv"),
    params:
        snp_pp_h4,
        db_url,
    shell:
        "python src/cmpt_comorbidites.py {params[0]} {params[1]} {output[0]}"

rule annot_gwas_metadata:
    input:
        gwas_trait_ods,
        gwas_category_ods,
    output:
        os.path.join(result_dir, "annot_gwas_metadata.py/gwas_metadata.ods"),
    shell:
        "python src/annot_gwas_metadata.py {input[0]} {input[1]} {output[0]}"

rule cmpt_proportion_tophits_eqtl:
    output:
        os.path.join(result_dir, "cmpt_proportion_tophits_eqtl.py/proportion_tophits_eqtl.tsv"),
        os.path.join(result_dir, "cmpt_proportion_tophits_eqtl.py/subplots.png"),
        # fig 1a
        os.path.join(result_dir, "cmpt_proportion_tophits_eqtl.py/loci_explained_proportion.png"),
    params:
        snp_pp_h4=snp_pp_h4,
        db_url=db_url,
    shell:
        "python src/cmpt_proportion_tophits_eqtl.py {params.snp_pp_h4} {params.db_url} {output[0]}"


